[workspace]
kind = "mathematical-research"

[solver]
show_derivation = true
verify_with_code = true
prefer_exact_arithmetic = true
cite_external_claims = true
maximum_tool_runtime_seconds = 600
forbid_exponential_time = true
forbid_exponential_space = true

[artifacts]
goal = "goal.md"
tasks = "tasks.md"
memory = "memory.md"
scratchpad = "scratchpad.md"
solution = "solution.md"
