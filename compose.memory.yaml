# One Cognee container per problem, sharing the graph store and the LLM
# router with every other problem.
#
# This used to also carry its own private Neo4j (one Neo4j and one Cognee per
# problem — see git history for that file's header). The private-Neo4j split
# existed for two reasons, and this shape keeps both fixes while dropping the
# per-problem Neo4j container:
#
# - Contention was measured against one shared *Cognee* process fielding
#   every problem's requests — four concurrent runs against one Cognee
#   produced `409 Conflict` on a `recall_memory` that had already hung the
#   full ten-minute tool ceiling. Cognee stays per-problem here, unchanged:
#   this file still starts one Cognee container per problem, with its own
#   local metadata store, never learning another project's dataset exists.
#   Only the graph storage underneath is shared, via `compose.shared.yaml`.
# - The other reason was a Cognee application-layer bug: asking its search
#   API for one project's dataset by name returned another project's chunk
#   regardless, because the dataset field was silently unenforced
#   (`docs/memory.md`, `src/orchestrator/vector_store.rs`). That bug lived in
#   query-time filtering. Isolation here does not depend on it at all: each
#   problem's Cognee is statically pointed at its own pre-created Neo4j
#   database (`GRAPH_DATABASE_NAME` below), and a Neo4j driver session is
#   bound to one named database at the Bolt protocol level — probed live, a
#   container pointed at `pe1` got `[]` back from `SHOW DATABASES` run inside
#   its own session, and a literal Cypher `MATCH` naming another problem's
#   sentinel by name came back empty too. It cannot enumerate another
#   problem's database, let alone query it, independent of anything Cognee's
#   own search-scoping code does or does not enforce correctly. This needs
#   Neo4j Enterprise — Community cannot create additional databases at all
#   (`OSError: Local Neo4j multi-user mode requires a Neo4j deployment that
#   supports CREATE/DROP DATABASE`, measured directly against the Community
#   image) — which `compose.shared.yaml` runs.
#
# No Cognee auth/multi-tenant machinery is involved. `REQUIRE_AUTHENTICATION`
# and `ENABLE_BACKEND_ACCESS_CONTROL` both stay unset (false): every call
# `src/orchestrator/vector.rs` sends is exactly as unauthenticated as before,
# and needs no Rust change.
#
# Two things a caller must supply that a private-Neo4j stack did not need:
#
# - `GRAPH_DATABASE_NAME` — this problem's Neo4j database name. Must already
#   exist: `scripts/memory-up` runs `CREATE DATABASE <name> IF NOT EXISTS`
#   against the shared instance before this file's `cognee` service starts,
#   because Cognee does not create a named database on first connect when
#   `ENABLE_BACKEND_ACCESS_CONTROL` is off (measured: `ClientError:
#   Neo.ClientError.Database.DatabaseNotFound` on ingest otherwise) — it only
#   ever expects the database to already be there.
# - The shared backbone (`compose.shared.yaml`: Neo4j and the ladder) must
#   already be up. `scripts/memory-up` brings it up first, by calling
#   `scripts/shared-up`, so nothing has to remember the ordering.
#
# Bring one up with `scripts/memory-up <workspace-label>`, which sets the
# compose project name — that is what keeps one problem's Cognee container
# and volumes distinct from another's. Do not run this file without `-p`.
networks:
  default: {}
  # `compose.shared.yaml`'s Neo4j Enterprise instance.
  graph:
    external: true
    name: ${GRAPH_NETWORK:-math-agent-shared_graph}
  # `compose.shared.yaml`'s ladder router, for memory's own LLM calls (entity
  # extraction during cognify, summarisation). Routed rather than pointed
  # straight at one provider so one exhausted key does not stop every
  # problem's ingest at once — the ladder steps Surplus -> Mistral ->
  # OpenRouter on its own; `../llm-ladder-router/config.toml` owns the ladder.
  router:
    external: true
    name: ${LADDER_NETWORK:-math-agent-shared_router}

services:
  cognee:
    image: cognee/cognee:1.4.2
    restart: unless-stopped
    environment:
      LLM_PROVIDER: custom
      # litellm (Cognee's LLM client) requires a provider prefix on the model
      # string even against a custom OpenAI-compatible endpoint — bare
      # `flash` raises `BadRequestError: LLM Provider NOT provided` on every
      # call, which the health check then reports as a flat 30s timeout since
      # each attempt fails instantly and litellm's own retry/backoff eats the
      # budget. `openai/` is litellm's convention for "treat this as an
      # OpenAI-compatible endpoint"; the ladder is the actual routing, and
      # `flash` is the router's ordinary-role ladder — the same tier
      # `MATH_AGENT_MODEL` defaults to for every non-reasoning role.
      LLM_MODEL: openai/flash
      LLM_API_KEY: ${MATH_AGENT_API_KEY}
      LLM_ENDPOINT: http://ladder:6969/v1
      LLM_ARGS: '{"max_tokens":8192}'
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      EMBEDDING_DIMENSIONS: 384
      HUGGINGFACE_TOKENIZER: BAAI/bge-small-en-v1.5
      GRAPH_DATABASE_PROVIDER: neo4j
      GRAPH_DATABASE_URL: bolt://neo4j:7687
      # Set by `scripts/memory-up`, one name per problem. Required: an unset
      # value here is not "use the default database", it is "two problems
      # share a graph", so this fails loudly rather than falling back.
      GRAPH_DATABASE_NAME: ${GRAPH_DATABASE_NAME:?GRAPH_DATABASE_NAME must name this problem's own Neo4j database}
      GRAPH_DATABASE_USERNAME: neo4j
      GRAPH_DATABASE_PASSWORD: cognee-local
      REQUIRE_AUTHENTICATION: "false"
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      # Lets `/api/v1/add` take a URL as well as an uploaded file, so a source
      # can be handed over by reference. Note what it grants: the *server*
      # then performs the fetch, from inside this network, where the runtime
      # container's own egress rules do not apply. Nothing here publishes a
      # host port, which is what kept that fetch off-box before and still
      # does.
      ALLOW_HTTP_REQUESTS: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 10s
      # 20s, not 5s. Several calibration problems run at once now, each with
      # its own Cognee container, and several initialising together load the
      # box enough that a *healthy* server fails a five-second probe — the
      # health log read `Health check exceeded timeout (5s)` three times over
      # while the server's own log showed it coming up normally. A probe that
      # times out under load reports the wrong thing about the service.
      timeout: 20s
      retries: 30
      start_period: 30s
    mem_limit: 4g
    networks:
      - default
      - graph
      - router
    volumes:
      - cognee-system:/app/cognee/.cognee_system
      - cognee-data:/app/cognee/.data_storage
      # The `max_tokens`/`reasoning.max_tokens` fix above stops the reasoning
      # model from running out of budget, but a second, rarer failure of the
      # same `SummarizedContent` schema survived it: this prompt tells the
      # model to "Output two sections only" as free text, while `instructor`
      # wraps the same call in a JSON-schema tool call for `{summary,
      # description}`. The model's own visible reasoning on a failed chunk
      # showed it noticing the contradiction and guessing at how to reconcile
      # a two-section text format with a JSON object — sometimes emitting
      # `{}`, once emitting a JSON key with a stray leading quote. The
      # corrected copy says once, explicitly, that `summary` is the one
      # string to fill; ranked below the LLM env keys because it is a
      # bind-mount over a vendored file rather than a value Cognee exposes as
      # configuration — there is no env var for a prompt template.
      - ./cognee-overrides/summarize_content.txt:/app/cognee/infrastructure/llm/prompts/summarize_content.txt:ro

volumes:
  cognee-system:
  cognee-data:
