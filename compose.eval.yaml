# Overlay that turns an ordinary run into a calibration run.
#
#   docker compose -f compose.yaml -f compose.eval.yaml run --rm agent ...
#
# `./calibrate <slug>` does this for you and also compiles the blocklist,
# checks nothing is already running on the workspace, and seeds the statement.
# Use it rather than invoking compose directly.
#
# Nothing here changes `compose.yaml`, so an ordinary run against a genuinely
# open conjecture is untouched by any of it.
#
# # What this file is for
#
# A calibration run works on a conjecture that has **already been solved**,
# stated as open, so that the harness's trajectory can be scored against a known
# destination. That measures nothing unless the published answer is out of
# reach — and the tool-layer screen cannot manage that alone, because
# `execute_command` runs Python in the container and the container has
# unrestricted network. Three lines of `urllib` reach any paper on the web
# without passing a single screened tool.
#
# So this overlay takes the container's default route away. All egress goes
# through `screen-proxy`, which holds a host allowlist and refuses everything
# else. HTTPS CONNECT shows a proxy only `host:port`, so the division of labour
# is: **the proxy decides which hosts are reachable, and the Rust screen — the
# only layer that sees plaintext — decides whether an allowed source reveals the
# answer.**
#
# # The consequence, accepted deliberately
#
# `download_document` can only reach the hosts below, so a calibration run
# cannot fetch an arbitrary page it found through search. Content still arrives:
# Exa performs its own fetches server-side and returns the text through
# `read_sources` and `deep_research`, which the Rust screen reads in plaintext.
# That is the intended shape — the container talks to APIs, and *content* comes
# through tools that can be screened.

networks:
  # The one line that takes the run's default route away.
  #
  # `compose.yaml` gives the agent `agent-egress`, an ordinary bridge, and that
  # is the only routable network it has — `memory` and `router` are both
  # declared `internal` by `compose.shared.yaml`. Marking the same network
  # `internal` here leaves the attachment in place and removes its gateway, so
  # the agent keeps reaching `cognee:8000` and `ladder:6969` and loses
  # everything else.
  #
  # It is done this way round because a Compose override *merges* a service's
  # network list and cannot remove an attachment from it. Redefining the
  # network is what an overlay can do, and the effect is the same. The network
  # belongs to this run's own project, so the proxy below can sit on it without
  # appearing on anything another problem is using.
  agent-egress:
    driver: bridge
    internal: true

  # The proxy's own way out. Only the proxy is on it.
  egress:
    driver: bridge

volumes:
  # This calibration run's memory, and no other run's. Named for the slug so
  # two calibration problems on one box do not share a data directory, and so
  # the directory survives a continuation the way the shared one does.
  eval-memory:
    name: ${MATH_AGENT_EVAL_SLUG:?set MATH_AGENT_EVAL_SLUG, or use ./calibrate}-cortexdb

services:
  # This run's own memory server, replacing the shared one for the duration.
  #
  # The shared CortexDB holds every problem's memory behind one operator key,
  # and the self-hosted image cannot mint a scoped token to divide it — so what
  # keeps one problem out of another's memory there is the scope the runtime
  # builds, which is code in this repository rather than a refusal from the
  # server (`src/orchestrator/cortex.rs` states it plainly). That is an
  # acceptable boundary for an ordinary run and not for this one: the thing a
  # calibration run must not reach is *another problem's memory*, because a
  # sibling working on the same literature is exactly where the withheld answer
  # would be written down. A separate process with a separate data directory is
  # not a better filter, it is the absence of a shared store to filter.
  #
  # Cognee needs no equivalent and gets none: it makes each problem a tenant
  # and answers another tenant's dataset `404`, so `MATH_AGENT_MEMORY=cognee`
  # on a calibration run keeps using the shared server.
  eval-memory:
    image: cortexdb/cortexdb:v0.9.8
    restart: unless-stopped
    environment:
      # A per-run credential, and it never leaves this Compose project. It is
      # not read from `.env`: this server holds nothing worth reaching from
      # anywhere else, and giving it the deployment key would be one more way
      # for a run to end up talking to the shared one.
      CORTEX_API_KEY: eval-local-${MATH_AGENT_EVAL_SLUG}
      OPENAI_API_KEY: ${MATH_AGENT_API_KEY}
      CORTEX_LLM_URL: ${MATH_AGENT_API_BASE_URL:-http://host.docker.internal:6969/v1}
      CORTEX_LLM_MODEL: flash
      CORTEX_ENRICHMENT_MODEL: flash
      CORTEX_EMBEDDING_URL: ${MATH_AGENT_API_BASE_URL:-http://host.docker.internal:6969/v1}
      CORTEX_EMBEDDING_MODEL: ${CORTEX_EMBEDDING_MODEL:-vectors}
      CORTEX_EMBEDDING_DIMS: ${CORTEX_EMBEDDING_DIMS:-3072}
      CORTEX_ANSWER_PROVIDER: openai
      CORTEX_ANSWER_URL: ${MATH_AGENT_API_BASE_URL:-http://host.docker.internal:6969/v1}
      CORTEX_ANSWER_MODEL: flash
      CORTEX_VERIFIER_URL: ${MATH_AGENT_API_BASE_URL:-http://host.docker.internal:6969/v1}
      CORTEX_VERIFIER_MODEL: flash
      CORTEX_V1_LAYERS_AUTO: "1"
      # Smaller than the shared server's, because this one holds one problem.
      CORTEX_VECTOR_RESIDENT_MAX: ${CORTEX_EVAL_VECTOR_RESIDENT_MAX:-500000}
      CORTEX_EVICT_VECTORS_ON_ENRICH: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3141/v1/admin/ready || exit 1"]
      interval: 10s
      timeout: 20s
      retries: 30
      start_period: 30s
    # Nothing is published. The agent reaches it by name on the run's own
    # network, which is what keeps this server invisible to every other run on
    # the box — including the other direction, which is the one that matters.
    mem_limit: ${CORTEX_EVAL_MEM_LIMIT:-4g}
    cpus: ${CORTEX_EVAL_CPUS:-2}
    networks:
      # `egress` is the proxy's own way out, and this server needs it for the
      # same narrow reason the proxy does: its extraction and embedding calls
      # go to the ladder, which is reached by address rather than over a shared
      # Docker network.
      #
      # Note what that grants and what it does not. This container has a route
      # out that the *agent* does not, so it is worth being explicit: nothing
      # the run can do turns that into a read. The agent's only writes here are
      # text and bytes it already holds, and the only thing this server fetches
      # is a model completion for text the run supplied. There is no path by
      # which a URL the run names is retrieved and handed back — that is
      # `download_document`, which is on the agent and behind the proxy.
      egress:
        priority: 100
      agent-egress:
        priority: 10
    volumes:
      - eval-memory:/data

  screen-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    image: riemann-screen-proxy:local
    restart: unless-stopped
    networks:
      # `priority` decides which attachment supplies the container's **default
      # route**, and it is load-bearing rather than cosmetic. Attached to the
      # internal network first, the proxy inherits a default route with no
      # gateway and cannot reach anything: every allowed host then fails with a
      # tunnel error, which reads exactly like a broken allowlist. Verified by
      # getting it wrong — `openrouter.ai` came back blocked until `egress` was
      # made the higher-priority attachment.
      egress:
        priority: 100
      agent-egress:
        priority: 10
    # The allowlist. Every entry is an API the runtime itself needs, and
    # nothing here serves documents to a human reader.
    #
    # Deliberately absent: arxiv.org, the encyclopedias, and the scholarly
    # mirrors. Those are where a solved conjecture's answer is written down, and
    # allowing them at this layer would reopen the `execute_command` path that
    # this overlay exists to close. Their content is still reachable through
    # Exa, whose fetches happen at Exa and come back through a screened tool.
    environment:
      # The shared stack is the one *infrastructure* entry here, and it is the
      # entry that makes a calibration run possible at all: the memory server
      # and the ladder used to sit on gatewayless Docker networks the container
      # was joined to, and a run that cannot reach them has no memory and no
      # model. It is set from `MATH_AGENT_SHARED_ALLOWLIST` rather than written
      # in, because it is an address for this deployment rather than a fact
      # about the run — and it is a host this deployment owns, which is what
      # separates it from the sources deliberately kept out below.
      ALLOWED_HOSTS: >-
        ${MATH_AGENT_SHARED_ALLOWLIST:-host.docker.internal},
        openrouter.ai,
        api.exa.ai,
        oeis.org,
        api.openalex.org,
        pypi.org,
        files.pythonhosted.org,
        ${MATH_AGENT_LANGFUSE_HOST:-langfuse.invalid}
    # Read-only and unprivileged, on the same argument as the runtime: this
    # container decides what the run can reach, so it is worth at least as much
    # hardening as the thing it constrains.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m

  agent:
    depends_on:
      - screen-proxy
      - eval-memory
    environment:
      # This run's own memory server, by name on the run's own network, in
      # place of the shared one `compose.yaml` points at. `NO_PROXY` below
      # covers it: it is inside this Compose project, so routing it through the
      # proxy would be asking the allowlist about a host that never leaves.
      CORTEX_API_URL: http://eval-memory:3141
      CORTEX_API_KEY: eval-local-${MATH_AGENT_EVAL_SLUG}
      # Convenience, not enforcement. Every HTTP client in the container reads
      # these, so well-behaved traffic goes straight to the proxy — but a
      # client that ignores them does not thereby escape, because there is no
      # route out to ignore them *to*. The network is the control; these two
      # lines only spare the run a pile of timeouts.
      HTTP_PROXY: http://screen-proxy:8888
      HTTPS_PROXY: http://screen-proxy:8888
      http_proxy: http://screen-proxy:8888
      https_proxy: http://screen-proxy:8888
      # The memory server and the ladder are reached by address now, and that
      # address may be another machine — so unlike everything else here they
      # are *allowed* rather than unreachable, and they go through the proxy
      # like any other host. `MATH_AGENT_SHARED_ALLOWLIST` names them in the
      # proxy's own list below; there is nothing to exempt here.
      #
      # Localhost stays exempt because it never leaves the container.
      NO_PROXY: localhost,127.0.0.1,eval-memory
      no_proxy: localhost,127.0.0.1,eval-memory
      # Arms the tool-layer screen. Named but unreadable is a hard startup
      # failure by design; see `orchestrator::screen::policy`.
      MATH_AGENT_SCREEN: /etc/riemann/screen.json
    volumes:
      # Exactly one file, read-only — not a directory and not the repository.
      # It is the compiled blocklist, in which every term is a salted digest,
      # because `execute_command` can read any file the runtime can and a
      # plaintext blocklist here would hand the run the names it withholds.
      - type: bind
        source: ./evals/.build/${MATH_AGENT_EVAL_SLUG:?set MATH_AGENT_EVAL_SLUG, or use ./calibrate}/screen.json
        target: /etc/riemann/screen.json
        read_only: true
