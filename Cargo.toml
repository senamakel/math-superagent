[package]
name = "rust-template"
version = "0.1.5"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "An embeddable, vendored TinyAgents harness for Rust."
repository = "https://github.com/tinyhumansai/rust-template"
documentation = "https://docs.rs/rust-template"
readme = "README.md"
keywords = ["tinyagents", "agent", "harness", "llm"]
categories = ["development-tools"]
publish = false
# Keep the published package to what a consumer actually needs.
exclude = [
    ".github/",
    ".gitmodules",
    "docs/",
    "vendor/",
    "worktrees/",
    ".env.example",
    "deny.toml",
]

[lib]
# Keep the ordinary Rust library for tests and downstream reuse while also
# Keep the ordinary Rust library and a native artifact for embedders.
crate-type = ["rlib", "cdylib"]

[dependencies]
# TinyAgents provides the provider-neutral agent loop and tool runtime. The
# vendored checkout is intentionally used without SQLite, REPL, or RLM features.
tinyagents = { path = "vendor/tinyagents", default-features = false }
# Implements the asynchronous TinyAgents `Tool` trait for the bundled basic
# tools without hand-written future boxing.
async-trait = "0.1"
# Builds and reads the JSON argument objects passed to agent tools.
serde_json = "1"
# Calls Exa's HTTPS search endpoint from the bundled web-search tool. Rustls
# avoids a system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Loads the git-ignored local `.env` before resolving provider and telemetry
# credentials, while preserving already-exported process variables.
dotenvy = "0.15"
# Derive macros for the crate-wide error type in `src/error/mod.rs`. Every
# dependency entry should carry a comment like this one saying why it is here.
thiserror = "2"

[dev-dependencies]
# Harness integration tests use Tokio's deterministic asynchronous runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[features]
default = []

# Lints apply to the whole crate and to every target. CI runs clippy with
# `-D warnings`, so anything set to "warn" here fails the build in CI.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
