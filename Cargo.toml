[package]
name = "rust-template"
version = "0.1.5"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "An embeddable, vendored OpenHuman runtime for Rust."
repository = "https://github.com/tinyhumansai/rust-template"
documentation = "https://docs.rs/rust-template"
readme = "README.md"
keywords = ["openhuman", "agent", "harness", "llm"]
categories = ["development-tools"]
publish = false
# Keep the published package to what a consumer actually needs.
exclude = [
    ".github/",
    ".gitmodules",
    "docs/",
    "vendor/",
    "worktrees/",
    ".env.example",
    "deny.toml",
]

[lib]
# Keep the ordinary Rust library for tests and downstream reuse while also
# Keep the ordinary Rust library and a native artifact for embedders.
crate-type = ["rlib", "cdylib"]

[dependencies]
# The complete OpenHuman Rust core. Product integrations are compiled with
# OpenHuman's default feature set disabled and selected at runtime through a
# domain set that excludes memory, channels, and Web3. `memory-git` is enabled
# only to select OpenHuman's complete memory-diff module instead of its broken
# no-feature stub; the Memory domain remains disabled by `agent::domains()`.
openhuman-core = { package = "openhuman", path = "vendor/openhuman", default-features = false, features = ["memory-git"] }
# Derive macros for the crate-wide error type in `src/error/mod.rs`. Every
# dependency entry should carry a comment like this one saying why it is here.
thiserror = "2"

[features]
default = []

[patch.crates-io]
# Keep OpenHuman's first-party crate family pinned to the revisions vendored
# inside the OpenHuman checkout.
motosan-ai-oauth = { path = "vendor/openhuman/vendor/motosan-ai-oauth" }
tinyagents = { path = "vendor/openhuman/vendor/tinyagents" }
tinyflows = { path = "vendor/openhuman/vendor/tinyflows" }
tinycortex = { path = "vendor/openhuman/vendor/tinycortex" }
tinyjuice = { path = "vendor/openhuman/vendor/tinyjuice" }
tinychannels = { path = "vendor/openhuman/vendor/tinychannels" }
tinyplace = { path = "vendor/openhuman/vendor/tinyplace/sdk/rust" }

# Lints apply to the whole crate and to every target. CI runs clippy with
# `-D warnings`, so anything set to "warn" here fails the build in CI.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
