[package]
name = "math-agent"
version = "0.1.5"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
description = "A Dockerized mathematical research and problem-solving agent."
readme = "README.md"
keywords = ["agent", "mathematics", "research", "tinyagents", "llm"]
categories = ["science", "development-tools"]
publish = false
# Keep the published package to what a consumer actually needs.
exclude = [
    ".github/",
    ".gitmodules",
    "vendor/",
    "worktrees/",
    ".env.example",
    "deny.toml",
]

[lib]
# Keep the ordinary Rust library for tests and downstream reuse while also
# Keep the ordinary Rust library and a native artifact for embedders.
crate-type = ["rlib", "cdylib"]

[dependencies]
# TinyAgents provides the provider-neutral agent loop and tool runtime. The
# vendored checkout is intentionally used without SQLite, REPL, or RLM features.
tinyagents = { path = "vendor/tinyagents", default-features = false }
# TinyFlows owns the state-graph runtime the agent loop is built on. The same
# runtime used to be consumed from TinyAgents; it was extracted into TinyFlows,
# where it is maintained, and carries the scheduling this loop wants — per-node
# concurrency bounds and mixed `Command::route` fan-out — which the TinyAgents
# copy does not. Default features only: the workflow engine's host capabilities,
# Chrome companion, and durable store are all a host concern this crate already
# solves its own way.
tinyflows = { path = "vendor/tinyflows", default-features = false }
# Implements the asynchronous TinyAgents `Tool` trait for the bundled basic
# tools without hand-written future boxing.
async-trait = "0.1"
# Builds and reads the JSON argument objects passed to agent tools.
serde_json = "1"
# Calls Exa's HTTPS search endpoint from the bundled web-search tool. Rustls
# avoids a system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
# Runs tool-builder commands asynchronously inside the jailed Docker workspace
# and enforces a wall-clock timeout without blocking the agent runtime.
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "time"] }
# Loads the git-ignored local `.env` before resolving provider and telemetry
# credentials, while preserving already-exported process variables.
dotenvy = "0.15"
# Derive macros for the crate-wide error type in `src/error/mod.rs`. Every
# dependency entry should carry a comment like this one saying why it is here.
thiserror = "2"
# Extracts the text layer from downloaded PDFs so a paper becomes readable
# Markdown instead of a UTF-8 failure that ends the run.
pdf-extract = { version = "0.12", default-features = false }
# Terminal UI for `euler-tui`, which watches one run with a tab per team.
# Optional so the runtime image — built with default features — does not carry
# a terminal library it can never use; the Docker container has no terminal.
ratatui = { version = "0.29", optional = true }
# Raw mode, the alternate screen, and key events for the same binary. Pulled in
# by ratatui already; named here because this code uses it directly.
crossterm = { version = "0.28", optional = true }

[features]
default = []
# Builds the `euler-tui` binary. Enabled by the `./euler-tui` wrapper and by
# `--all-features`, so the code is linted and compiled in CI like everything
# else.
tui = ["dep:ratatui", "dep:crossterm"]

[[bin]]
name = "euler-tui"
path = "src/bin/euler_tui.rs"
required-features = ["tui"]

# Lints apply to the whole crate and to every target. CI runs clippy with
# `-D warnings`, so anything set to "warn" here fails the build in CI.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
