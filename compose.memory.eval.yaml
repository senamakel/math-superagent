# Overlay that takes the memory stack's network off the internet.
#
#   scripts/memory-up --eval <workspace-label>
#
# `compose.memory.yaml` gives each problem its own Cognee on an implicit
# `default` bridge, and the agent joins that bridge to reach `cognee:8000`. A
# bridge has a gateway, so joining it is also how the agent
# gets to the rest of the internet — which is fine for an ordinary run and
# fatal for a calibration one, where `execute_command` could then fetch the
# paper that carries the answer.
#
# This overlay marks that network `internal: true`, so it has no gateway, and
# gives Cognee a second network that does. The agent, which is only ever on the
# first, keeps its memory server and loses its route out. Everything else it
# needs arrives through `screen-proxy` in `compose.eval.yaml`.

# The `graph` and `router` networks Cognee also joins are both declared
# `internal: true` by `compose.shared.yaml`, so neither adds a route out and
# neither needs an entry here.

networks:
  default:
    internal: true
  # Cognee's own way out. Its LLM calls go through the ladder on the internal
  # `router` network and need nothing from this, but the embedding provider
  # fetches its model on a cold volume, so removing this would turn a fresh
  # calibration stack into a startup failure rather than a tighter boundary.
  cognee-egress:
    driver: bridge

services:
  cognee:
    networks:
      - default
      - graph
      - router
      - cognee-egress
