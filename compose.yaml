networks:
  memory:
    external: true
    name: ${COGNEE_NETWORK:-cognee-local_default}

services:
  agent:
    build:
      context: .
    image: math-agent:local
    env_file:
      - .env
    environment:
      AGENT_WORKSPACE: /workspace
      COGNEE_API_URL: http://cognee:8000
      MATH_AGENT_CONTAINER: "1"
      # Run controls forwarded from the host wrapper. Empty means "use the
      # built-in default", so an unset variable never widens or narrows a run.
      MATH_AGENT_RESEARCH: ${MATH_AGENT_RESEARCH:-on}
      MATH_AGENT_SCHOOLS: ${MATH_AGENT_SCHOOLS:-}
      MATH_AGENT_LOOP_MINUTES: ${MATH_AGENT_LOOP_MINUTES:-}
      MATH_AGENT_PROVIDER: ${MATH_AGENT_PROVIDER:-}
      MATH_AGENT_REQUEST_SECONDS: ${MATH_AGENT_REQUEST_SECONDS:-}
      MATH_AGENT_MAX_MODEL_CALLS: ${MATH_AGENT_MAX_MODEL_CALLS:-}
      MATH_AGENT_MAX_TOOL_CALLS: ${MATH_AGENT_MAX_TOOL_CALLS:-}
      MATH_AGENT_RUN_MINUTES: ${MATH_AGENT_RUN_MINUTES:-}
      MATH_AGENT_TOOL_MINUTES: ${MATH_AGENT_TOOL_MINUTES:-}
      MATH_AGENT_TURN_OUTPUT_TOKENS: ${MATH_AGENT_TURN_OUTPUT_TOKENS:-}
      MATH_AGENT_CONTEXT_TOKENS: ${MATH_AGENT_CONTEXT_TOKENS:-}
      MATH_AGENT_CONTEXT_MINUTES: ${MATH_AGENT_CONTEXT_MINUTES:-}
      MATH_AGENT_REASONING_MODEL: ${MATH_AGENT_REASONING_MODEL:-}
      MATH_AGENT_REASONING_PROVIDER: ${MATH_AGENT_REASONING_PROVIDER:-}
      # The Lean scribe's tier. `MISTRAL_API_KEY` is deliberately absent from
      # this block and arrives through `env_file` instead: this list overrides
      # the file, so naming it here would set it to the empty string whenever
      # the host shell lacks it and silently disable the tier. Keys ride `.env`;
      # run knobs ride this list.
      MATH_AGENT_SCRIBE_MODEL: ${MATH_AGENT_SCRIBE_MODEL:-}
      MATH_AGENT_SCRIBE_RPS: ${MATH_AGENT_SCRIBE_RPS:-}
      MATH_AGENT_SCRIBE_CONCURRENCY: ${MATH_AGENT_SCRIBE_CONCURRENCY:-}
      MATH_AGENT_VERIFY_BATCH: ${MATH_AGENT_VERIFY_BATCH:-}
      MATH_AGENT_DOSSIER_TOKENS: ${MATH_AGENT_DOSSIER_TOKENS:-}
      # The reading layer. `MATH_AGENT_RLM=off` withholds `map_document`; the
      # rest raise or lower a bound and are empty by default.
      MATH_AGENT_RLM: ${MATH_AGENT_RLM:-on}
      MATH_AGENT_READ_CEILING: ${MATH_AGENT_READ_CEILING:-}
      MATH_AGENT_READ_SLICE: ${MATH_AGENT_READ_SLICE:-}
      MATH_AGENT_RLM_CHUNK_BYTES: ${MATH_AGENT_RLM_CHUNK_BYTES:-}
      MATH_AGENT_RLM_MAX_CHUNKS: ${MATH_AGENT_RLM_MAX_CHUNKS:-}
      MATH_AGENT_RLM_CONCURRENCY: ${MATH_AGENT_RLM_CONCURRENCY:-}
      MATH_AGENT_WORKSPACE_LABEL: ${MATH_AGENT_WORKSPACE_LABEL:-}
    user: "${MATH_AGENT_LOCAL_UID:-1000}:${MATH_AGENT_LOCAL_GID:-1000}"
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # 2g killed a live run outright: the kernel OOM-killed the Erdős–Gyárfás
    # container mid-attempt (`oom` then `die exit=137`), which loses everything
    # in flight and writes nothing to the log, so the run simply stops. The cap
    # covers the Rust runtime, every concurrent child, and every Python
    # subprocess they spawn together, and this work is graph enumeration and
    # BFS over millions of states — problem 763 recorded the old cap in its own
    # MEMORY.md as a mathematical ceiling, "exact BFS stops at N=14".
    #
    # A limit is kept because the sandbox requires one; it is the value that was
    # wrong. Four gigabytes was wrong too: a live Erdős–Gyárfás run was
    # OOM-killed at forty minutes — `docker events` shows `oom` then
    # `die exitCode=137`, execDuration 2427s — while holding a `nauty-geng`
    # enumeration of 34,758,006 graphs at n=17 and an expansion census to n=22
    # beside five concurrent child runs. Nothing reached the console; the run
    # simply stopped appearing, which is why the first check after it read as a
    # hung specialist rather than a dead container.
    #
    # The cap has been raised four times — 2g to 4g, 4g to 8g, 8g to 16g on
    # 2026-08-15, and 16g to 24g on 2026-08-17 — and only the first three were
    # because a run met it. That is a rule with no fixed point, and the note
    # here once said eight gigabytes "does not move again". It moved, so the
    # honest version is the one below rather than a firmer promise that the
    # next run also breaks.
    #
    # What has not changed is what an OOM means. The gilbreath run died at 161
    # minutes (exit 137, three `oom` events) materialising a depth-4000
    # exact-integer difference triangle a row at a time was enough for every
    # earlier capture on the same question. That is a finding about the
    # approach, not a shortage: stream instead of materialising, count with
    # `geng -u` instead of collecting, bound the degree, or reduce the question
    # to one a solver can answer. Sixteen gigabytes buys a bigger wrong method
    # a little more room, and nothing else.
    #
    # The 24g raise was asked for rather than met, and it is a bet on a shape
    # of work this runtime has not yet done: a proof whose last third is a
    # generated certificate — the ProofAtlas Sendov bundle wanted one Lean
    # worker under a 32 GiB address-space limit for 4,524 build jobs
    # (`research/proofatlas/01-sendov-bundle-anatomy.md`). Nothing that size
    # fits under sixteen, so the ceiling was answering the question before the
    # method got to.
    #
    # 24g overcommits this box on purpose. It holds 30 GiB of RAM, and the
    # `cognee` service below keeps its own 8g, so the two can ask for more than
    # is free. `memswap_limit` is what makes that survivable rather than fatal:
    # it is the *total* of RAM and swap, so 56g grants 24 GiB resident and 32
    # GiB of the box's 87 GiB of swap. Docker already permitted swap here —
    # `mem_limit` without `memswap_limit` defaults to twice the memory — so the
    # change is that the allowance is now deliberate and stated instead of
    # inherited.
    #
    # Swap turns an OOM kill into a slowdown, and the slowdown is the new
    # failure to watch for. A container thrashing 32 GiB of swap does not die;
    # it gets slower by orders of magnitude, and every tool call looks hung.
    # Read `vmstat 5` — sustained non-zero `si`/`so` is the signature — and
    # treat it exactly as an OOM was treated: a finding about the method.
    # Streaming beats materialising at 24 GiB for the same reason it did at 8.
    #
    # Read `docker events --filter event=oom` whenever a container vanishes
    # without an error — the kernel writes nothing to the console, so the run
    # just stops appearing and reads as a hung child. But record the result as
    # a sandbox limit, never as a mathematical ceiling: problem 763 wrote the
    # old cap into its own notes as "exact BFS stops at N=14", which was never
    # true of the mathematics.
    mem_limit: 24g
    memswap_limit: 56g
    volumes:
      - type: bind
        source: ${MATH_AGENT_WORKSPACE_PATH:-./workspace/default}
        target: /workspace
    # The memory backend is shared rather than per-checkout. Cognee scopes its
    # graph by project, so one server serves every checkout on the box with the
    # datasets kept apart, and standing this stack up twice would mean two graph
    # stores, two Neo4j instances, and a fight over ports 8000 and 3000 — the
    # second copy simply fails to bind.
    #
    # `COGNEE_NETWORK` names the compose network that stack is on, so the agent
    # joins it and reaches the server as `cognee:8000`. It is external because
    # this file does not own it: the lifetime of the memory server is longer
    # than any one run, and a run must never be able to take it down. There is
    # no `depends_on` for the same reason — the server is expected to be up
    # already, and `./agent` says so plainly when it is not.
    networks:
      - memory

  cognee:
    image: cognee/cognee:1.4.2
    # Only with `--profile own-memory`. The shared server on the external
    # `memory` network is the default; standing a second one up would bind the
    # same host ports and fail.
    profiles:
      - own-memory
    restart: unless-stopped
    environment:
      LLM_PROVIDER: custom
      LLM_MODEL: openrouter/deepseek/deepseek-v4-flash-0731
      # The memory's own key; see `compose.memory.yaml`, where the same line
      # carries the argument. Unset falls back to the run's.
      LLM_API_KEY: ${OPENROUTER_MEMORY_API_KEY:-${OPENROUTER_API_KEY}}
      LLM_ENDPOINT: https://openrouter.ai/api/v1
      LLM_ARGS: '{"extra_headers":{"HTTP-Referer":"https://opencompany.tinyhumans.ai/","X-OpenRouter-Title":"OpenCompany","X-OpenRouter-Categories":"personal-agent"}}'
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      EMBEDDING_DIMENSIONS: 384
      HUGGINGFACE_TOKENIZER: BAAI/bge-small-en-v1.5
      GRAPH_DATABASE_PROVIDER: neo4j
      GRAPH_DATABASE_URL: bolt://neo4j:7687
      GRAPH_DATABASE_NAME: neo4j
      GRAPH_DATABASE_USERNAME: neo4j
      GRAPH_DATABASE_PASSWORD: cognee-local
      REQUIRE_AUTHENTICATION: "false"
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      # Lets `/api/v1/add` and `/api/v1/remember` take a URL as well as an
      # uploaded file, so a source can be handed over by reference rather than
      # by bytes. The download path does not use it — the runtime has the bytes
      # already, and a URL would skip the 5 MiB bound, the frontier's fetch
      # ledger, and the `raw/` archive — but the memory server is shared, and
      # this stack must match the one actually serving the box.
      #
      # Note what it grants: the *server* performs the fetch, from inside the
      # Docker network, where the runtime container's egress rules do not
      # apply. Keep the API bound to 127.0.0.1, as the port mapping below does;
      # that binding is what stops the fetch being reachable from off-box.
      ALLOW_HTTP_REQUESTS: "true"
      UI_APP_URL: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 8g
    volumes:
      - cognee-system:/app/cognee/.cognee_system
      - cognee-data:/app/cognee/.data_storage
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26
    # Only with `--profile own-memory`. The shared server on the external
    # `memory` network is the default; standing a second one up would bind the
    # same host ports and fail.
    profiles:
      - own-memory
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/cognee-local
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p cognee-local 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - neo4j-data:/data

  cognee-ui:
    build:
      context: https://github.com/topoteretes/cognee.git#v1.4.2:cognee-frontend
    image: cognee-ui:1.4.2-local
    # Only with `--profile own-memory`. The shared server on the external
    # `memory` network is the default; standing a second one up would bind the
    # same host ports and fail.
    profiles:
      - own-memory
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_LOCAL_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      cognee:
        condition: service_healthy

volumes:
  cognee-system:
  cognee-data:
  neo4j-data:
