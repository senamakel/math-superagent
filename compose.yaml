# The harness, one container per run. Everything it talks to is somebody
# else's stack, joined by name:
#
#   compose.shared.yaml   one Neo4j Enterprise, one Cognee and one ladder,
#                         for every problem      (scripts/shared-up)
#
# Both shared networks below are therefore `external: true`: this file does not
# own either, the lifetime of both is longer than any one run, and a run must
# never be able to take one down. `./agent` brings them up in order and says so
# plainly when it cannot.
networks:
  # `compose.shared.yaml`'s Cognee, reached as `cognee:8000`. One server for
  # every problem, which the run addresses as its own tenant with the
  # `COGNEE_API_KEY` below; `scripts/memory-up` provisions that tenant and
  # prints this network's name.
  #
  # Gatewayless, like `router` and for the same reason. It used to be a
  # per-problem bridge, and joining it was also how an ordinary run reached the
  # internet — which meant a calibration run's isolation depended on bringing
  # the memory up through a second overlay that marked that bridge internal. It
  # is internal always now, and the run's egress is `agent-egress` below, which
  # `compose.eval.yaml` removes. A boundary that holds unless somebody passes a
  # flag is not a boundary.
  memory:
    external: true
    name: ${MEMORY_NETWORK:-math-agent-shared_memory}
  # `compose.shared.yaml`'s ladder, reached as `ladder:6969`. Deliberately
  # gatewayless: the agent can reach the router without gaining an escape route
  # during a calibration run.
  router:
    external: true
    name: ${LADDER_NETWORK:-math-agent-shared_router}
  # The run's own way out, and the only one it has. Owned by this file rather
  # than shared, so that an overlay can take it off this one service without
  # touching anything another problem is using: `compose.eval.yaml` replaces
  # this attachment with the screened proxy's network, and a calibration run is
  # then left with two internal networks and no default route.
  agent-egress:
    driver: bridge

services:
  agent:
    build:
      context: .
    image: math-agent:local
    env_file:
      - .env
    environment:
      AGENT_WORKSPACE: /workspace
      COGNEE_API_URL: http://cognee:8000
      # This run's tenant on the shared memory server, sent as an `X-Api-Key`
      # header on every request. `scripts/memory-up --key <workspace-label>`
      # provisions the tenant and prints it; `scripts/run-agent` passes it
      # through.
      #
      # Defaulted to empty rather than declared required (`:?`), and the
      # refusal lives in `VectorStore::from_env` instead. Compose interpolates
      # the whole file before it does anything with it, so a required variable
      # here also fails `./agent build` and `docker compose config --quiet` —
      # neither of which starts a run or touches the memory. An empty key is
      # still not an anonymous run: the server answers `401` to every call
      # while the run reports storing what it learned, which is the failure
      # shape `docs/memory.md` was written about, so the runtime refuses to
      # start rather than proceeding without one.
      COGNEE_API_KEY: ${COGNEE_API_KEY:-}
      MATH_AGENT_CONTAINER: "1"
      # Run controls forwarded from the host wrapper. Empty means "use the
      # built-in default", so an unset variable never widens or narrows a run.
      MATH_AGENT_RESEARCH: ${MATH_AGENT_RESEARCH:-on}
      MATH_AGENT_SCHOOLS: ${MATH_AGENT_SCHOOLS:-}
      MATH_AGENT_LOOP_MINUTES: ${MATH_AGENT_LOOP_MINUTES:-}
      # Provider endpoint/model are ordinary run knobs. The API key is omitted
      # deliberately and arrives through env_file: this list overrides the file,
      # so naming a key here would set it to the empty string whenever the host
      # shell lacks it. Keys ride `.env`; run knobs ride this list.
      MATH_AGENT_API_BASE_URL: ${MATH_AGENT_API_BASE_URL:-http://ladder:6969/v1}
      MATH_AGENT_MODEL: ${MATH_AGENT_MODEL:-flash}
      MATH_AGENT_REQUEST_SECONDS: ${MATH_AGENT_REQUEST_SECONDS:-}
      MATH_AGENT_MAX_MODEL_CALLS: ${MATH_AGENT_MAX_MODEL_CALLS:-}
      MATH_AGENT_MAX_TOOL_CALLS: ${MATH_AGENT_MAX_TOOL_CALLS:-}
      MATH_AGENT_RUN_MINUTES: ${MATH_AGENT_RUN_MINUTES:-}
      MATH_AGENT_TOOL_MINUTES: ${MATH_AGENT_TOOL_MINUTES:-}
      MATH_AGENT_TURN_OUTPUT_TOKENS: ${MATH_AGENT_TURN_OUTPUT_TOKENS:-}
      MATH_AGENT_CONTEXT_TOKENS: ${MATH_AGENT_CONTEXT_TOKENS:-}
      MATH_AGENT_CONTEXT_MINUTES: ${MATH_AGENT_CONTEXT_MINUTES:-}
      MATH_AGENT_REASONING_MODEL: ${MATH_AGENT_REASONING_MODEL:-reasoning}
      # The deepest ladder, for the four roles whose answer keeps improving
      # while the model thinks longer. Point it at `reasoning` to opt the tier
      # back out without a rebuild.
      MATH_AGENT_MAX_REASONING_MODEL: ${MATH_AGENT_MAX_REASONING_MODEL:-max-reasoning}
      # The Lean scribe's tier: the router's one-rung `scribe` ladder, reaching
      # Leanstral at Mistral directly because no marketplace resells it. The
      # Mistral credential lives beside the ladder, in `LADDER_ENV_FILE`, and no
      # longer enters this container. Point this at `flash` to opt the tier out.
      MATH_AGENT_SCRIBE_MODEL: ${MATH_AGENT_SCRIBE_MODEL:-scribe}
      MATH_AGENT_SCRIBE_RPS: ${MATH_AGENT_SCRIBE_RPS:-}
      MATH_AGENT_SCRIBE_CONCURRENCY: ${MATH_AGENT_SCRIBE_CONCURRENCY:-}
      MATH_AGENT_VERIFY_BATCH: ${MATH_AGENT_VERIFY_BATCH:-}
      MATH_AGENT_DOSSIER_TOKENS: ${MATH_AGENT_DOSSIER_TOKENS:-}
      # The reading layer. `MATH_AGENT_RLM=off` withholds `map_document`; the
      # rest raise or lower a bound and are empty by default.
      MATH_AGENT_RLM: ${MATH_AGENT_RLM:-on}
      MATH_AGENT_READ_CEILING: ${MATH_AGENT_READ_CEILING:-}
      MATH_AGENT_READ_SLICE: ${MATH_AGENT_READ_SLICE:-}
      MATH_AGENT_RLM_CHUNK_BYTES: ${MATH_AGENT_RLM_CHUNK_BYTES:-}
      MATH_AGENT_RLM_MAX_CHUNKS: ${MATH_AGENT_RLM_MAX_CHUNKS:-}
      MATH_AGENT_RLM_CONCURRENCY: ${MATH_AGENT_RLM_CONCURRENCY:-}
      MATH_AGENT_WORKSPACE_LABEL: ${MATH_AGENT_WORKSPACE_LABEL:-}
    user: "${MATH_AGENT_LOCAL_UID:-1000}:${MATH_AGENT_LOCAL_GID:-1000}"
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # 2g killed a live run outright: the kernel OOM-killed the Erdős–Gyárfás
    # container mid-attempt (`oom` then `die exit=137`), which loses everything
    # in flight and writes nothing to the log, so the run simply stops. The cap
    # covers the Rust runtime, every concurrent child, and every Python
    # subprocess they spawn together, and this work is graph enumeration and
    # BFS over millions of states — problem 763 recorded the old cap in its own
    # MEMORY.md as a mathematical ceiling, "exact BFS stops at N=14".
    #
    # A limit is kept because the sandbox requires one; it is the value that was
    # wrong. Four gigabytes was wrong too: a live Erdős–Gyárfás run was
    # OOM-killed at forty minutes — `docker events` shows `oom` then
    # `die exitCode=137`, execDuration 2427s — while holding a `nauty-geng`
    # enumeration of 34,758,006 graphs at n=17 and an expansion census to n=22
    # beside five concurrent child runs. Nothing reached the console; the run
    # simply stopped appearing, which is why the first check after it read as a
    # hung specialist rather than a dead container.
    #
    # The cap has been raised four times — 2g to 4g, 4g to 8g, 8g to 16g on
    # 2026-08-15, and 16g to 24g on 2026-08-17 — and only the first three were
    # because a run met it. That is a rule with no fixed point, and the note
    # here once said eight gigabytes "does not move again". It moved, so the
    # honest version is the one below rather than a firmer promise that the
    # next run also breaks.
    #
    # What has not changed is what an OOM means. The gilbreath run died at 161
    # minutes (exit 137, three `oom` events) materialising a depth-4000
    # exact-integer difference triangle a row at a time was enough for every
    # earlier capture on the same question. That is a finding about the
    # approach, not a shortage: stream instead of materialising, count with
    # `geng -u` instead of collecting, bound the degree, or reduce the question
    # to one a solver can answer. Sixteen gigabytes buys a bigger wrong method
    # a little more room, and nothing else.
    #
    # 24g was the cap until the memory became one shared server. It was a bet
    # on a shape of work this runtime has not yet done — a proof whose last
    # third is a generated certificate, the ProofAtlas Sendov bundle wanting
    # one Lean worker under a 32 GiB address-space limit for 4,524 build jobs
    # (`research/proofatlas/01-sendov-bundle-anatomy.md`) — and it was asked
    # for rather than met.
    #
    # 4g now, with 250m reserved, and the reason is arithmetic about the box
    # rather than about any one run: several runs are live at once, and a
    # ceiling that overcommits by itself overcommits by the number of them.
    # The reservation is the other half of the same decision — it is what the
    # scheduler holds back for a container that is idle between turns, so a
    # busy neighbour cannot leave a waking run with nothing.
    #
    # This narrows what a single run may materialise, and the note above is
    # what to read when one meets it: the answer is to stream, to count rather
    # than collect, or to reduce the question — not to raise this line. The
    # 4,524-job case is the one shape that genuinely does not fit, and it
    # wants its own deliberately-raised run rather than a standing ceiling
    # every problem is given.
    #
    # `memswap_limit` is what makes a spike survivable rather than fatal:
    # it is the *total* of RAM and swap, so 8g grants 4 GiB resident and 4
    # GiB of the box's swap. Docker already permitted swap here —
    # `mem_limit` without `memswap_limit` defaults to twice the memory — so the
    # change is that the allowance is now deliberate and stated instead of
    # inherited.
    #
    # Swap turns an OOM kill into a slowdown, and the slowdown is the new
    # failure to watch for. A container thrashing 32 GiB of swap does not die;
    # it gets slower by orders of magnitude, and every tool call looks hung.
    # Read `vmstat 5` — sustained non-zero `si`/`so` is the signature — and
    # treat it exactly as an OOM was treated: a finding about the method.
    # Streaming beats materialising at 24 GiB for the same reason it did at 8.
    #
    # Read `docker events --filter event=oom` whenever a container vanishes
    # without an error — the kernel writes nothing to the console, so the run
    # just stops appearing and reads as a hung child. But record the result as
    # a sandbox limit, never as a mathematical ceiling: problem 763 wrote the
    # old cap into its own notes as "exact BFS stops at N=14", which was never
    # true of the mathematics.
    mem_limit: ${MATH_AGENT_MEM_LIMIT:-4g}
    memswap_limit: ${MATH_AGENT_MEMSWAP_LIMIT:-8g}
    mem_reservation: 250m
    # A deliberately loose ceiling, and looser than the box has cores on
    # purpose. A run is bursty — `nauty-geng`, a Lean build, a sieve — and for
    # most of its life it is waiting on a model call using nothing at all, so a
    # tight per-run limit would idle the box to protect it from a spike that
    # only one run is having at a time. Several runs at eight simply contend,
    # which is the intended behaviour: `cpus` is a ceiling, not a reservation.
    #
    # What stops that contention from starving the memory is the *weight*
    # rather than this number. `compose.shared.yaml` gives Neo4j and Cognee
    # `cpu_shares: 2048` against the default 1024 here, so under full load each
    # shared service gets twice the slice of one run — enough that a dozen
    # busy runs cannot make every problem's recall slow at once.
    cpus: ${MATH_AGENT_CPUS:-8}
    volumes:
      - type: bind
        source: ${MATH_AGENT_WORKSPACE_PATH:-./workspace/default}
        target: /workspace
    # There is no `depends_on` for the shared networks' services — neither is
    # in this project, both are expected to be up already, and the launcher
    # starts them in order rather than this file declaring an edge it cannot
    # express across projects.
    #
    # `priority` decides which attachment supplies the **default route**, and
    # it is load-bearing rather than cosmetic. `memory` and `router` are both
    # `internal`, so a container that took its default route from either has no
    # gateway and every provider call fails as a connection error. The egress
    # attachment must win, which is what these numbers say.
    networks:
      agent-egress:
        priority: 100
      router:
        priority: 10
      memory:
        priority: 5
